<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Veteran Service Pathways (Interactive)</title>
<style>
:root{--bg:#0b0f17;--panel:#0f1626;--panel2:#101a2e;--text:#e8eefc;--muted:rgba(232,238,252,.72);--border:rgba(255,255,255,.12);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.topbar{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.title{font-weight:800;letter-spacing:.2px}
.subtitle{font-size:13px;color:var(--muted)}
.wrap{display:grid;grid-template-columns: 420px 1fr; height: calc(100vh - 56px);}
.sidebar{border-right:1px solid var(--border); padding:12px; overflow:auto; background: linear-gradient(180deg, var(--panel), var(--panel2));}
.main{position:relative; overflow:auto; padding:12px}
.card{background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px}
.card h3{margin:0 0 8px 0;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
button{background:rgba(255,255,255,.08); border:1px solid var(--border); color:var(--text); border-radius:12px; padding:8px 10px; cursor:pointer; font-weight:650; font-size:13px}
button:hover{background:rgba(255,255,255,.12)}
button.primary{background:rgba(96,165,250,.18);border-color:rgba(96,165,250,.30)}
button.primary:hover{background:rgba(96,165,250,.26)}
input[type="search"]{width:100%; padding:9px 10px; border-radius:12px; outline:none; background:rgba(255,255,255,.06); border:1px solid var(--border); color:var(--text)}
.small{font-size:12px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.06)}
.sel{display:grid; gap:10px}
.sel label{font-size:12px;color:var(--muted); display:block; margin-bottom:6px}
select{width:100%; min-height: 150px; padding:8px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid var(--border); color:var(--text);}
option{padding:4px}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi .pill{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.28)}
svg{display:block}
.node{cursor:pointer}
.node rect{rx:10; ry:10; stroke:rgba(255,255,255,.18); stroke-width:1.2; pointer-events:all}
.node text{font-size:12px; fill:#0b0f17; font-weight:750; pointer-events:none}
.edge{fill:none; stroke-width:3.0}
.edge.faded{stroke:rgba(255,255,255,.08)!important; stroke-width:2}
.node.faded{opacity:.18}
.node.active rect{stroke:rgba(255,255,255,.92); stroke-width:2.8}
.colHeader{font-size:12px; fill:rgba(232,238,252,.78); font-weight:750; letter-spacing:.5px}
.debug{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;line-height:1.35;color:rgba(232,238,252,.82);white-space:pre-wrap}
.footerhint{position:absolute; right:14px; bottom:10px; font-size:12px; color:var(--muted)}
.banner{margin-top:6px;font-size:12px;color:rgba(34,197,94,.92)}
</style>
</head>

</div>

</div>

<div class="pills" id="activePills"></div>
<div class="controls" style="margin-top:10px">
<button id="clearBtn">Reset slicers</button>
</div>
</div>

<div class="card">
<h3>Slicers</h3>

</aside>
<main class="main" id="mainPane">
<svg aria-label="Interactive framework diagram" id="viz" role="img"></svg>
<div class="footerhint" id="hint"></div>

</div>

  for (const lvl of LEVELS){
    const set = state.filters[lvl];
    if (set.size === 0) continue;
    if (!set.has(row[lvl])) return false;

function getFilteredRows(){ return RAW.filter(matchesFilters); }

  for (const lvl of LEVELS) {
    const saved = new Set(state.filters[lvl]);
    state.filters[lvl] = new Set();
    const rows = getFilteredRows();
    const opts = uniq(rows.map(r => r[lvl])).sort((a,b)=>a.localeCompare(b));
    state.filters[lvl] = saved;

    const q = (state.search[lvl] || "").trim().toLowerCase();
    const filteredOpts = q ? opts.filter(o => o.toLowerCase().includes(q)) : opts;

    const sel = document.getElementById("sel_" + lvlIndex(lvl));
    const currentSelected = new Set(Array.from(sel.selectedOptions).map(o=>o.value));
    sel.innerHTML = "";
    for (const o of filteredOpts) {
      const opt = document.createElement("option");
      opt.value = o;
      opt.textContent = o;
      if (saved.has(o) || currentSelected.has(o)) opt.selected = true;
      sel.appendChild(opt);
    }
  }

function buildGraph(rows){
  const nodesByLevel = Object.fromEntries(LEVELS.map(l => [l, new Map()]));
  const nodePaths = new Map();
  const edgePaths = new Map();

  function addNode(lvl, label){
    const id = nodeId(lvl, label);
    if (!nodesByLevel[lvl].has(id)) {

      nodePaths.set(id, new Set());
    }
    return id;
  }
  function addEdge(aId, bId, pathId){
    const key = aId + "->" + bId;
    if (!edgePaths.has(key)) edgePaths.set(key, new Set());
    edgePaths.get(key).add(pathId);
  }

  for (const r of rows){
    const p = r._path_id;
    let prev = null;
    for (const lvl of LEVELS){
      const id = addNode(lvl, r[lvl]);
      nodePaths.get(id).add(p);
      if (prev) addEdge(prev, id, p);
      prev = id;
    }
  }

  const nodes = [];
  for (const lvl of LEVELS){
    for (const n of nodesByLevel[lvl].values()){
      n.count = nodePaths.get(n.id).size;
      nodes.push(n);
    }
  }

  const edges = [];
  for (const [k, set] of edgePaths.entries()){
    const parts = k.split("->");
    edges.push({from: parts[0], to: parts[1], count: set.size, key: k});
  }

  const outAdj = new Map();
  const inAdj = new Map();
  for (const n of nodes){ outAdj.set(n.id, new Set()); inAdj.set(n.id, new Set()); }
  for (const e of edges){ outAdj.get(e.from).add(e.to); inAdj.get(e.to).add(e.from); }

  return {nodes, edges, outAdj, inAdj};
}

function visibleSubgraph(graph){
  if (state.view === "expanded") {
    return {visNodes: new Set(graph.nodes.map(n=>n.id)), visEdges: new Set(graph.edges.map(e=>e.key))};
  }
  const visNodes = new Set();
  const visEdges = new Set();
  for (const n of graph.nodes) if (n.lvl === LEVELS[0]) visNodes.add(n.id);
  for (let i=0;i<LEVELS.length-1;i++) {
    const curLvl = LEVELS[i];
    const nextLvl = LEVELS[i+1];
    const sel = state.pathSel[curLvl];
    if (!sel) break;
    visNodes.add(sel);
    for (const nxt of (graph.outAdj.get(sel) || [])) {
      if (nxt.startsWith(nextLvl + "::")) {
        visNodes.add(nxt);
        visEdges.add(sel + "->" + nxt);
      }
    }
  }
  return {visNodes, visEdges};
}

function computeHighlight(graph, focusId){
  if (!focusId) return null;
  const keepNodes = new Set([focusId]);
  const keepEdges = new Set();
  const q1 = [focusId];
  while(q1.length) {
    const cur = q1.shift();
    for (const nxt of (graph.outAdj.get(cur) || [])) {
      keepEdges.add(cur + "->" + nxt);
      if (!keepNodes.has(nxt)) { keepNodes.add(nxt); q1.push(nxt); }
    }
  }
  const q2 = [focusId];
  while(q2.length) {
    const cur = q2.shift();
    for (const prv of (graph.inAdj.get(cur) || [])) {
      keepEdges.add(prv + "->" + cur);
      if (!keepNodes.has(prv)) { keepNodes.add(prv); q2.push(prv); }
    }
  }
  return {keepNodes, keepEdges};
}

function layout(graph, vis){
  const nodeW = 300, nodeH = 36, gapY = 14, gapX = 420;
  const padX = 120, padY = 100;

  const arrByLevel = LEVELS.map(lvl =>
    graph.nodes.filter(n => n.lvl===lvl && vis.visNodes.has(n.id)).sort((a,b)=>a.label.localeCompare(b.label))
  );
  const colHeights = arrByLevel.map(arr => arr.length ? (arr.length*nodeH + (arr.length-1)*gapY) : 0);
  const maxH = Math.max(...colHeights, nodeH);

  const contentW = (LEVELS.length-1)*gapX + nodeW;
  const canvasW = contentW + padX*2;
  const canvasH = maxH + padY*2;

  const startX = (canvasW - contentW)/2;
  const startY = (canvasH - maxH)/2;

  const xByLevel = new Map();
  LEVELS.forEach((lvl, i)=> xByLevel.set(lvl, startX + i*gapX));

  const nodesPos = new Map();
  LEVELS.forEach((lvl, i)=>{
    const arr = arrByLevel[i];
    const colH = colHeights[i] || 0;
    let y = startY + (maxH - colH)/2; // center within column
    for (const n of arr) {
      nodesPos.set(n.id, {x:xByLevel.get(lvl), y:y, w:nodeW, h:nodeH});
      y += nodeH + gapY;
    }
  });

  return {nodesPos, width:canvasW, height:canvasH, xByLevel, headerY:startY - 18};
}

let rafPending = false;
function renderSoon(){ 
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{ rafPending=false; render(); });
}

function render(){ 
  const rows = getFilteredRows();
  const graph = buildGraph(rows);
  const vis = visibleSubgraph(graph);
  const lay = layout(graph, vis);

  const svg = document.getElementById("viz");
  svg.setAttribute("width", lay.width);
  svg.setAttribute("height", lay.height);
  svg.setAttribute("viewBox", `0 0 ${lay.width} ${lay.height}`);
  svg.innerHTML = "";

  const bg = document.createElementNS("http://www.w3.org/2000/svg","rect");
  bg.setAttribute("x",0); bg.setAttribute("y",0); bg.setAttribute("width",lay.width); bg.setAttribute("height",lay.height);
  bg.setAttribute("fill","transparent");
  bg.style.pointerEvents="all";
  bg.addEventListener("pointerdown", ()=>{ state.selected=null; state.lastClick="background"; renderSoon(); });
  svg.appendChild(bg);

  const focus = state.selected || state.hovered;
  const hl = computeHighlight(graph, focus);

  for (let i=0;i<LEVELS.length;i++) {
    const lvl = LEVELS[i];
    const x = lay.xByLevel.get(lvl);
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", x);
    t.setAttribute("y", lay.headerY);
    t.setAttribute("class","colHeader");
    t.textContent = lvl;
    svg.appendChild(t);
  }

  for (const e of graph.edges) {
    if (!vis.visNodes.has(e.from) || !vis.visNodes.has(e.to)) continue;
    if (state.view==="collapsed" && !vis.visEdges.has(e.key)) continue;
    const a = lay.nodesPos.get(e.from), b=lay.nodesPos.get(e.to);
    if (!a||!b) continue;
    const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2, mid=(x1+x2)/2;
    const d=`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    const faded=(hl && !hl.keepEdges.has(e.key));
    path.setAttribute("d", d);
    path.setAttribute("class", "edge" + (faded ? " faded" : ""));
    path.setAttribute("stroke-opacity", faded ? "0.12" : "0.90");
    path.setAttribute("stroke", nodeColor(e.from));
    path.style.pointerEvents="none";
    svg.appendChild(path);
  }

  for (const n of graph.nodes) {
    if (!vis.visNodes.has(n.id)) continue;
    const pos=lay.nodesPos.get(n.id);
    if (!pos) continue;
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    const faded=(hl && !hl.keepNodes.has(n.id));
    const active=(focus===n.id);
    g.setAttribute("class","node" + (faded ? " faded" : "") + (active ? " active" : ""));
    g.style.pointerEvents="all";

    const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
    rect.setAttribute("x",pos.x); rect.setAttribute("y",pos.y); rect.setAttribute("width",pos.w); rect.setAttribute("height",pos.h);
    rect.setAttribute("fill", nodeColor(n.id));
    rect.style.pointerEvents="all";
    g.appendChild(rect);

    const text=document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x",pos.x+10); text.setAttribute("y",pos.y+23);
    text.textContent = labelTrunc(n.label) + "  (" + n.count + ")";
    g.appendChild(text);

    g.addEventListener("pointerenter", ()=>{ if (state.isPointerDown) return; state.hovered=n.id; renderSoon(); });
    g.addEventListener("pointerleave", ()=>{ if (state.isPointerDown) return; state.hovered=null; renderSoon(); });

    g.addEventListener("pointerdown", (ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      state.isPointerDown = true;
      state.lastClick = n.id;
      state.selected = (state.selected===n.id) ? null : n.id;
      if (state.view==="collapsed") {
        state.pathSel[n.lvl] = (state.pathSel[n.lvl]===n.id) ? null : n.id;
        const idx = lvlIndex(n.lvl);
        for (let j=idx+1;j<LEVELS.length;j++) state.pathSel[LEVELS[j]] = null;
      }
      renderSoon();
    });

    g.addEventListener("pointerup", ()=>{ state.isPointerDown = false; });
    g.addEventListener("pointercancel", ()=>{ state.isPointerDown = false; });

    svg.appendChild(g);
  }

  document.getElementById("viewLabel").textContent = (state.view==="expanded") ? "Fully expanded view (all pathways)" : "Collapsed view (drill)";
  document.getElementById("hint").textContent = (state.view==="expanded")
    ? "Fully expanded: hover highlights in/out; press on a node to lock highlight; use slicers to filter."
    : "Collapsed: press on a node to reveal connected nodes in the next column.";
  }

function buildSlicers() {
  const wrap = document.getElementById("slicerWrap");
  wrap.innerHTML = "";
  LEVELS.forEach((lvl, idx)=>{
    const div = document.createElement("div");
    div.innerHTML = `
      <div>
        <label>${lvl} (search + multi-select)</label>
        <input id="q_${idx}" type="search" placeholder="Search ${lvl}..."/>
        <select id="sel_${idx}" multiple></select>
      </div>
    `;
    wrap.appendChild(div);
  });

  LEVELS.forEach((lvl, idx)=>{
    const sel = document.getElementById("sel_" + idx);
    for (const o of uniq(RAW.map(r=>r[lvl])).sort((a,b)=>a.localeCompare(b))) {
      const opt = document.createElement("option");
      opt.value=o; opt.textContent=o;
      sel.appendChild(opt);
    }
    sel.addEventListener("change", ()=>{
      readSelections();
      setOptions();
      for (const l of LEVELS) state.pathSel[l] = null;
      state.selected = null;
      state.lastClick = "slicer-change";
      renderSoon();
      updateBadges();
    });
    document.getElementById("q_" + idx).addEventListener("input", (e)=>{
      state.search[lvl] = e.target.value || "";
      setOptions();
    });
  });
}

function resetCollapsed(){ state.view="collapsed"; for (const l of LEVELS) state.pathSel[l]=null; state.selected=null; state.hovered=null; state.lastClick=null; renderSoon(); }
function setExpanded(){ state.view="expanded"; for (const l of LEVELS) state.pathSel[l]=null; state.selected=null; state.hovered=null; state.lastClick=null; renderSoon(); }
function clearAll(){ 
  for (const l of LEVELS){ 
    state.filters[l]=new Set(); 
    state.search[l]=""; 
    const q = document.getElementById("q_"+lvlIndex(l)); if (q) q.value="";
  } 
  resetCollapsed(); 
  setOptions(); 
  updateBadges(); 
}

document.getElementById("collapsedBtn").addEventListener("click", resetCollapsed);
document.getElementById("expandedBtn").addEventListener("click", setExpanded);
document.getElementById("clearBtn").addEventListener("click", clearAll);

buildSlicers();
setOptions();
render();
updateBadges();
</script>
</body>
</html>
